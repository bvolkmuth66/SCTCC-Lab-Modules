<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How identity and access management works in the cloud</title>
  <desc id="d">Top: a user signs in to Microsoft Entra ID, the identity provider, which checks a password and multifactor authentication and issues an access token. The token is used to request access, and an IAM policy check looks at who the user is, what role they hold, and the scope of that role. If allowed, the user reaches cloud resources such as virtual machines and storage. If denied, access is blocked and logged. Bottom: in a hybrid setup, on-premises Active Directory accounts sync to Microsoft Entra ID through Microsoft Entra Connect, and the identity provider gives single sign-on to SaaS apps using SAML or OpenID Connect. Account types include users, groups, service accounts, and managed identities.</desc>
  <defs>
    <marker id="aBlue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 6, 0 12" fill="#1f5fd1"/></marker>
    <marker id="aGreen" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 6, 0 12" fill="#27ae60"/></marker>
    <marker id="aRed" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 6, 0 12" fill="#c0392b"/></marker>
    <marker id="aPurple" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 6, 0 12" fill="#8e44ad"/></marker>
  </defs>

  <text x="600" y="38" text-anchor="middle" fill="#0b2e6b" font-size="22" font-weight="700">Signing In and Getting Access</text>

  <!-- Arrows, top flow -->
  <line x1="170" y1="200" x2="255" y2="200" stroke="#1f5fd1" stroke-width="5" marker-end="url(#aBlue)"/>
  <line x1="510" y1="200" x2="575" y2="200" stroke="#1f5fd1" stroke-width="5" marker-end="url(#aBlue)"/>
  <line x1="725" y1="200" x2="785" y2="200" stroke="#1f5fd1" stroke-width="5" marker-end="url(#aBlue)"/>
  <polyline points="985,165 1005,165 1005,140 1025,140" fill="none" stroke="#27ae60" stroke-width="5" marker-end="url(#aGreen)"/>
  <polyline points="985,240 1005,240 1005,285 1025,285" fill="none" stroke="#c0392b" stroke-width="5" marker-end="url(#aRed)"/>

  <!-- Step labels -->
  <text x="212" y="185" text-anchor="middle" fill="#0d47a1" font-size="15" font-weight="700">1 Sign in</text>
  <text x="543" y="185" text-anchor="middle" fill="#0d47a1" font-size="15" font-weight="700">2 Token</text>
  <text x="755" y="185" text-anchor="middle" fill="#0d47a1" font-size="15" font-weight="700">3 Ask</text>

  <!-- User -->
  <circle cx="110" cy="200" r="60" fill="#27ae60"/>
  <text x="110" y="196" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">User</text>
  <text x="110" y="218" text-anchor="middle" fill="#ffffff" font-size="14">student or staff</text>

  <!-- Identity provider -->
  <rect x="260" y="115" width="250" height="170" rx="16" fill="#16a085"/>
  <text x="385" y="150" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Microsoft Entra ID</text>
  <text x="385" y="173" text-anchor="middle" fill="#e8fff8" font-size="14">identity provider</text>
  <rect x="285" y="190" width="200" height="75" rx="10" fill="#ffffff" fill-opacity="0.2"/>
  <text x="385" y="218" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Authentication</text>
  <text x="385" y="242" text-anchor="middle" fill="#ffffff" font-size="14">password + MFA</text>

  <!-- Token -->
  <rect x="580" y="160" width="145" height="80" rx="12" fill="#f39c12"/>
  <text x="652" y="196" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Access</text>
  <text x="652" y="218" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Token</text>

  <!-- Policy check -->
  <rect x="790" y="105" width="195" height="190" rx="16" fill="#0b2e6b"/>
  <text x="887" y="138" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">IAM Policy Check</text>
  <text x="887" y="158" text-anchor="middle" fill="#cfe0ff" font-size="13">authorization</text>
  <text x="810" y="196" fill="#ffffff" font-size="15"><tspan font-weight="700">Who:</tspan> user or group</text>
  <text x="810" y="228" fill="#ffffff" font-size="15"><tspan font-weight="700">What:</tspan> role</text>
  <text x="810" y="260" fill="#ffffff" font-size="15"><tspan font-weight="700">Where:</tspan> scope</text>

  <!-- Outcomes -->
  <rect x="1030" y="90" width="150" height="100" rx="12" fill="#2ecc71"/>
  <text x="1105" y="125" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Allowed</text>
  <text x="1105" y="150" text-anchor="middle" fill="#ffffff" font-size="14">VMs, storage,</text>
  <text x="1105" y="170" text-anchor="middle" fill="#ffffff" font-size="14">databases</text>
  <rect x="1030" y="240" width="150" height="90" rx="12" fill="#e74c3c"/>
  <text x="1105" y="276" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Denied</text>
  <text x="1105" y="300" text-anchor="middle" fill="#ffffff" font-size="14">blocked and logged</text>

  <!-- Authentication vs authorization brackets -->
  <text x="325" y="320" fill="#16a085" font-size="15" font-style="italic">Authentication: who are you?</text>
  <text x="887" y="335" text-anchor="middle" fill="#0b2e6b" font-size="15" font-style="italic">Authorization: what can you do?</text>

  <!-- ===== Hybrid panel ===== -->
  <rect x="25" y="375" width="1150" height="305" rx="20" fill="#eef5ff" stroke="#c9daf5" stroke-width="2"/>
  <text x="1150" y="415" text-anchor="end" fill="#0b2e6b" font-size="20" font-weight="700">Hybrid Identity and Single Sign-On</text>

  <!-- Sync arrows -->
  <line x1="245" y1="545" x2="285" y2="545" stroke="#8e44ad" stroke-width="5" marker-end="url(#aPurple)"/>
  <line x1="310" y1="490" x2="310" y2="292" stroke="#8e44ad" stroke-width="5" stroke-dasharray="12 7" marker-end="url(#aPurple)"/>
  <polyline points="510,260 560,260 560,545 600,545" fill="none" stroke="#1f5fd1" stroke-width="5" stroke-dasharray="12 7" marker-end="url(#aBlue)"/>

  <rect x="50" y="490" width="195" height="110" rx="14" fill="#c0392b"/>
  <text x="147" y="532" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">On-Premises</text>
  <text x="147" y="556" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Active Directory</text>
  <text x="147" y="581" text-anchor="middle" fill="#ffffff" font-size="13">campus accounts</text>

  <rect x="290" y="495" width="190" height="100" rx="14" fill="#8e44ad"/>
  <text x="385" y="530" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Microsoft Entra</text>
  <text x="385" y="551" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Connect</text>
  <text x="385" y="576" text-anchor="middle" fill="#ffffff" font-size="13">syncs accounts to cloud</text>
  <text x="322" y="455" fill="#7d3c98" font-size="14" font-weight="700">Directory sync</text>

  <rect x="605" y="490" width="235" height="110" rx="14" fill="#1f5fd1"/>
  <text x="722" y="528" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">SaaS Apps</text>
  <text x="722" y="553" text-anchor="middle" fill="#ffffff" font-size="14">single sign-on with</text>
  <text x="722" y="573" text-anchor="middle" fill="#ffffff" font-size="14">SAML or OpenID Connect</text>
  <text x="575" y="470" fill="#0d47a1" font-size="14" font-weight="700">Federation / SSO</text>

  <rect x="875" y="455" width="280" height="190" rx="14" fill="#ffffff" stroke="#1f5fd1" stroke-width="2"/>
  <text x="1015" y="488" text-anchor="middle" fill="#0b2e6b" font-size="17" font-weight="700">Account Types</text>
  <text x="898" y="525" fill="#333333" font-size="15"><tspan font-weight="700" fill="#0d47a1">Users:</tspan> people who sign in</text>
  <text x="898" y="557" fill="#333333" font-size="15"><tspan font-weight="700" fill="#0d47a1">Groups:</tspan> assign roles once</text>
  <text x="898" y="589" fill="#333333" font-size="15"><tspan font-weight="700" fill="#0d47a1">Service accounts:</tspan> for apps</text>
  <text x="898" y="621" fill="#333333" font-size="15"><tspan font-weight="700" fill="#0d47a1">Managed identities:</tspan> no secrets</text>

  <text x="50" y="655" fill="#555555" font-size="14" font-style="italic">One identity across campus, cloud, and SaaS apps: one place to enable MFA and remove access.</text>
</svg>
