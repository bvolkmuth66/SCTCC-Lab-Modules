<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Cloud automation: from code to running infrastructure</title>
  <desc id="d">Top: code, including infrastructure as code templates such as Terraform and Bicep, scripts in PowerShell, Bash, or Python, and configuration tools such as Ansible, is committed to a Git repository for version control. A pipeline then runs four stages. Continuous integration covers build and test; continuous delivery covers approve and deploy. If a test fails, the change goes back to be fixed and committed again. The pipeline deploys to development, test, and production environments. Bottom: maintenance tasks commonly automated in the cloud are patching, backups, scaling, start and stop schedules, certificate renewal, and drift detection, triggered by a schedule, an alert, or a code change.</desc>
  <defs>
    <marker id="aBlue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 6, 0 12" fill="#1f5fd1"/></marker>
    <marker id="aRed" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 6, 0 12" fill="#c0392b"/></marker>
  </defs>

  <text x="600" y="34" text-anchor="middle" fill="#0b2e6b" font-size="21" font-weight="700">From Code to Running Infrastructure</text>

  <!-- Arrows -->
  <line x1="240" y1="185" x2="272" y2="185" stroke="#1f5fd1" stroke-width="6" marker-end="url(#aBlue)"/>
  <line x1="420" y1="185" x2="452" y2="185" stroke="#1f5fd1" stroke-width="6" marker-end="url(#aBlue)"/>
  <line x1="950" y1="185" x2="982" y2="185" stroke="#1f5fd1" stroke-width="6" marker-end="url(#aBlue)"/>
  <!-- Failure loop -->
  <polyline points="637,236 637,330 130,330 130,302" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#aRed)"/>
  <rect x="290" y="317" width="250" height="26" rx="6" fill="#ffffff"/>
  <text x="415" y="335" text-anchor="middle" fill="#c0392b" font-size="15" font-weight="700">Test fails: fix and commit again</text>

  <!-- Code -->
  <rect x="25" y="65" width="215" height="235" rx="16" fill="#0b2e6b"/>
  <text x="132" y="98" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">Code</text>
  <rect x="40" y="112" width="185" height="55" rx="10" fill="#1f5fd1"/>
  <text x="132" y="135" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Infrastructure as Code</text>
  <text x="132" y="155" text-anchor="middle" fill="#dbe7ff" font-size="13">Terraform, Bicep</text>
  <rect x="40" y="175" width="185" height="55" rx="10" fill="#1f5fd1"/>
  <text x="132" y="198" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Scripts</text>
  <text x="132" y="218" text-anchor="middle" fill="#dbe7ff" font-size="13">PowerShell, Bash, Python</text>
  <rect x="40" y="238" width="185" height="55" rx="10" fill="#1f5fd1"/>
  <text x="132" y="261" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Configuration</text>
  <text x="132" y="281" text-anchor="middle" fill="#dbe7ff" font-size="13">Ansible</text>

  <!-- Repo -->
  <rect x="277" y="110" width="143" height="150" rx="16" fill="#5d6d7e"/>
  <text x="348" y="140" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Git</text>
  <text x="348" y="160" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Repository</text>
  <g stroke="#ffffff" stroke-width="3" fill="none"><path d="M315 225 h66 M330 225 q0 -22 22 -22 h14"/></g>
  <g fill="#f39c12"><circle cx="315" cy="225" r="6"/><circle cx="345" cy="225" r="6"/><circle cx="381" cy="225" r="6"/><circle cx="366" cy="203" r="6" fill="#2ecc71"/></g>
  <text x="348" y="250" text-anchor="middle" fill="#ecf0f1" font-size="12">version control</text>

  <!-- Pipeline -->
  <rect x="457" y="65" width="493" height="235" rx="16" fill="#eef5ff" stroke="#c9daf5" stroke-width="2"/>
  <text x="703" y="94" text-anchor="middle" fill="#0b2e6b" font-size="19" font-weight="700">CI/CD Pipeline</text>
  <!-- CI / CD brackets -->
  <path d="M478 118 v-8 h228 v8" fill="none" stroke="#16a085" stroke-width="3"/>
  <text x="592" y="124" text-anchor="middle" fill="#16a085" font-size="13" font-weight="700">Continuous Integration</text>
  <path d="M712 118 v-8 h226 v8" fill="none" stroke="#8e44ad" stroke-width="3"/>
  <text x="825" y="124" text-anchor="middle" fill="#8e44ad" font-size="13" font-weight="700">Continuous Delivery</text>
  <!-- Chevrons -->
  <polygon points="472,140 575,140 597,185 575,230 472,230 494,185" fill="#16a085"/>
  <text x="537" y="182" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Build</text>
  <text x="537" y="202" text-anchor="middle" fill="#ffffff" font-size="12">compile, package</text>
  <polygon points="590,140 693,140 715,185 693,230 590,230 612,185" fill="#1abc9c"/>
  <text x="655" y="182" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Test</text>
  <text x="655" y="202" text-anchor="middle" fill="#ffffff" font-size="12">run checks</text>
  <polygon points="708,140 811,140 833,185 811,230 708,230 730,185" fill="#a569bd"/>
  <text x="773" y="182" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Approve</text>
  <text x="773" y="202" text-anchor="middle" fill="#ffffff" font-size="12">review, sign-off</text>
  <polygon points="826,140 929,140 945,185 929,230 826,230 848,185" fill="#8e44ad"/>
  <text x="890" y="182" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Deploy</text>
  <text x="890" y="202" text-anchor="middle" fill="#ffffff" font-size="12">release</text>
  <text x="703" y="270" text-anchor="middle" fill="#555555" font-size="13" font-style="italic">runs on every commit (GitHub Actions, Azure Pipelines)</text>

  <!-- Environments -->
  <text x="1080" y="62" text-anchor="middle" fill="#0b2e6b" font-size="16" font-weight="700">Environments</text>
  <rect x="987" y="75" width="188" height="62" rx="12" fill="#2ecc71"/>
  <text x="1081" y="112" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Development</text>
  <rect x="987" y="152" width="188" height="62" rx="12" fill="#27ae60"/>
  <text x="1081" y="189" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Test</text>
  <rect x="987" y="229" width="188" height="62" rx="12" fill="#1e8449"/>
  <text x="1081" y="266" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Production</text>

  <!-- ===== Maintenance panel ===== -->
  <rect x="25" y="385" width="1150" height="320" rx="20" fill="#fff4e6" stroke="#f5cba7" stroke-width="2"/>
  <text x="50" y="422" fill="#0b2e6b" font-size="20" font-weight="700">Commonly Automated Maintenance</text>
  <text x="1150" y="422" text-anchor="end" fill="#555555" font-size="14" font-style="italic">triggered by a schedule, an alert, or a code change</text>

  <g text-anchor="middle">
    <rect x="50" y="445" width="355" height="110" rx="14" fill="#1f5fd1"/>
    <text x="227" y="488" fill="#ffffff" font-size="19" font-weight="700">Patching</text>
    <text x="227" y="516" fill="#ffffff" font-size="14">OS and software updates on a</text>
    <text x="227" y="536" fill="#ffffff" font-size="14">maintenance window</text>

    <rect x="422" y="445" width="355" height="110" rx="14" fill="#16a085"/>
    <text x="599" y="488" fill="#ffffff" font-size="19" font-weight="700">Backups</text>
    <text x="599" y="516" fill="#ffffff" font-size="14">scheduled copies kept by a</text>
    <text x="599" y="536" fill="#ffffff" font-size="14">retention policy</text>

    <rect x="794" y="445" width="355" height="110" rx="14" fill="#8e44ad"/>
    <text x="971" y="488" fill="#ffffff" font-size="19" font-weight="700">Scaling</text>
    <text x="971" y="516" fill="#ffffff" font-size="14">add or remove instances</text>
    <text x="971" y="536" fill="#ffffff" font-size="14">as demand changes</text>

    <rect x="50" y="572" width="355" height="110" rx="14" fill="#d35400"/>
    <text x="227" y="615" fill="#ffffff" font-size="19" font-weight="700">Start and Stop Schedules</text>
    <text x="227" y="643" fill="#ffffff" font-size="14">shut down lab and dev VMs</text>
    <text x="227" y="663" fill="#ffffff" font-size="14">after hours to save money</text>

    <rect x="422" y="572" width="355" height="110" rx="14" fill="#c0392b"/>
    <text x="599" y="615" fill="#ffffff" font-size="19" font-weight="700">Certificate Renewal</text>
    <text x="599" y="643" fill="#ffffff" font-size="14">renew TLS certificates before</text>
    <text x="599" y="663" fill="#ffffff" font-size="14">they expire</text>

    <rect x="794" y="572" width="355" height="110" rx="14" fill="#0b2e6b"/>
    <text x="971" y="615" fill="#ffffff" font-size="19" font-weight="700">Drift Detection</text>
    <text x="971" y="643" fill="#ffffff" font-size="14">find and fix settings that no</text>
    <text x="971" y="663" fill="#ffffff" font-size="14">longer match the code</text>
  </g>
</svg>
