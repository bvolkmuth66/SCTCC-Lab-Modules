<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 584" width="100%" style="max-width:560px;height:auto;display:block;margin:0 auto;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="30" y="30" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#004a99">Three ways through the same stack</text>
<rect x="150" y="64" width="264" height="54" rx="4" fill="#ffffff" stroke="#9db4d0" stroke-width="1.3"/>
<text x="166" y="87" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#333333">Application</text>
<text x="166" y="105" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">the user sees a failure here</text>
<rect x="150" y="126" width="264" height="54" rx="4" fill="#ffffff" stroke="#9db4d0" stroke-width="1.3"/>
<text x="166" y="149" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#333333">Transport</text>
<text x="166" y="167" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">ports, sessions, and filters</text>
<rect x="150" y="188" width="264" height="54" rx="4" fill="#eef3fa" stroke="#004a99" stroke-width="1.8"/>
<text x="166" y="211" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#004a99">Network</text>
<text x="166" y="229" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">addressing, routing, and reachability</text>
<rect x="150" y="250" width="264" height="54" rx="4" fill="#ffffff" stroke="#9db4d0" stroke-width="1.3"/>
<text x="166" y="273" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#333333">Data Link</text>
<text x="166" y="291" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">VLANs, trunks, and spanning tree</text>
<rect x="150" y="312" width="264" height="54" rx="4" fill="#ffffff" stroke="#9db4d0" stroke-width="1.3"/>
<text x="166" y="335" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#333333">Physical</text>
<text x="166" y="353" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">cables, ports, and light</text>
<line x1="118" y1="70" x2="118" y2="350" stroke="#004a99" stroke-width="2.4"/><polygon points="111,350 125,350 118,360" fill="#004a99"/>
<text x="104" y="54" text-anchor="end" font-family="Arial" font-size="13" font-weight="bold" fill="#004a99">Top down</text>
<line x1="446" y1="360" x2="446" y2="80" stroke="#1a7a34" stroke-width="2.4"/><polygon points="439,80 453,80 446,70" fill="#1a7a34"/>
<text x="460" y="380" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#1a7a34">Bottom up</text>
<line x1="430" y1="209" x2="430" y2="104" stroke="#b36b00" stroke-width="2"/><polygon points="423,104 437,104 430,94" fill="#b36b00"/>
<line x1="430" y1="221" x2="430" y2="326" stroke="#b36b00" stroke-width="2"/><polygon points="423,326 437,326 430,336" fill="#b36b00"/>
<circle cx="430" cy="215" r="7" fill="#b36b00"/>
<text x="444" y="209" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="bold" fill="#b36b00">Divide</text>
<text x="444" y="227" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="bold" fill="#b36b00">and conquer</text>
<line x1="30" y1="400" x2="530" y2="400" stroke="#d9e1ea" stroke-width="1.3"/>
<text x="30" y="426" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#004a99">Top down</text>
<text x="30" y="444" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">when the report is about an application and the network looks healthy.</text>
<text x="30" y="474" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#1a7a34">Bottom up</text>
<text x="30" y="492" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">when something physical changed, or many users failed at once.</text>
<text x="30" y="522" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#b36b00">Divide and conquer</text>
<text x="30" y="540" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">when you have no idea. Test reachability first, then work outward from</text>
<text x="30" y="558" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">whichever direction the answer points.</text>
</svg>
