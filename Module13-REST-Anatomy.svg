<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="100%" style="max-width:560px;height:auto;display:block;margin:0 auto;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="30" y="30" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#004a99">Anatomy of one request and its answer</text>
<rect x="30" y="50" width="500" height="132" rx="5" fill="#ffffff" stroke="#004a99" stroke-width="1.5"/>
<rect x="44" y="64" width="54" height="26" rx="13" fill="#004a99"/>
<text x="71" y="82" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#ffffff">GET</text>
<text x="110" y="82" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">the verb says what to do, not what to change</text>
<text x="44" y="112" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#333333">https://198.51.100.10/restconf/data/</text>
<text x="44" y="130" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="bold" fill="#333333">ietf-interfaces:interfaces</text>
<text x="340" y="121" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">which resource</text>
<text x="44" y="158" text-anchor="start" font-family="Courier New, monospace" font-size="11.5" font-weight="normal" fill="#333333">Accept: application/yang-data+json</text>
<text x="340" y="158" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">which format</text>
<line x1="280" y1="182" x2="280" y2="205" stroke="#7a8794" stroke-width="2.2"/><polygon points="274,205 286,205 280,214" fill="#7a8794"/>
<text x="292" y="204" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">and the device answers</text>
<rect x="30" y="214" width="500" height="150" rx="5" fill="#f2f8f3" stroke="#1a7a34" stroke-width="1.5"/>
<rect x="44" y="228" width="78" height="26" rx="13" fill="#1a7a34"/>
<text x="83" y="246" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#ffffff">200 OK</text>
<text x="134" y="246" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">the status code is the first thing a script must read</text>
<text x="44" y="278" text-anchor="start" font-family="Courier New, monospace" font-size="11.5" font-weight="normal" fill="#333333">{ "ietf-interfaces:interfaces": {</text>
<text x="44" y="296" text-anchor="start" font-family="Courier New, monospace" font-size="11.5" font-weight="normal" fill="#333333">    "interface": [ {</text>
<text x="44" y="314" text-anchor="start" font-family="Courier New, monospace" font-size="11.5" font-weight="normal" fill="#333333">        "name": "GigabitEthernet0/0/0",</text>
<text x="44" y="332" text-anchor="start" font-family="Courier New, monospace" font-size="11.5" font-weight="normal" fill="#333333">        "enabled": true } ] } }</text>
<line x1="30" y1="384" x2="530" y2="384" stroke="#d9e1ea" stroke-width="1.3"/>
<text x="30" y="410" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#004a99">Verbs</text>
<text x="96" y="410" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">GET reads, POST creates, PUT replaces, PATCH alters part,</text>
<text x="96" y="428" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">DELETE removes. Only GET changes nothing.</text>
<text x="30" y="458" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#004a99">Codes</text>
<text x="96" y="458" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">200s succeeded, 400s mean your request was wrong,</text>
<text x="96" y="476" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">500s mean the device failed. A script that ignores the code</text>
<text x="96" y="494" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">will report success for a request that changed nothing.</text>
</svg>
