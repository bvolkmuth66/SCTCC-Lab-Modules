<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Cloud storage and databases at a glance</title>
  <desc id="d">Top row compares four storage options. Block storage attaches to one virtual machine, as Azure Managed Disks or AWS EBS, and suits operating system disks and databases. File storage is a shared folder over SMB or NFS, as Azure Files or AWS EFS. Object storage is reached over HTTPS and a REST API, as Azure Blob Storage or AWS S3, and suits media, backups, and data lakes. Databases are relational, with tables and SQL, or NoSQL, with documents and key-value pairs, such as Azure SQL Database, Cosmos DB, AWS RDS, and DynamoDB. The middle row shows object storage access tiers from hot to cool, cold, and archive: moving toward archive lowers storage cost but raises access cost and retrieval time. The bottom row separates redundancy, copies the provider keeps (LRS, ZRS, GRS), from backups, copies you control (snapshots, a backup service, and the 3-2-1 rule). Redundancy is not a backup, because a deleted file is deleted in every copy.</desc>

  <!-- ===== Row 1: storage types ===== -->
  <!-- Block -->
  <rect x="25" y="20" width="265" height="320" rx="16" fill="#ffffff" stroke="#1f5fd1" stroke-width="3"/>
  <rect x="25" y="20" width="265" height="50" rx="16" fill="#1f5fd1"/><rect x="25" y="50" width="265" height="20" fill="#1f5fd1"/>
  <text x="157" y="53" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">Block Storage</text>
  <g fill="#1f5fd1">
    <rect x="95" y="88" width="28" height="22" rx="3"/><rect x="128" y="88" width="28" height="22" rx="3"/><rect x="161" y="88" width="28" height="22" rx="3"/><rect x="194" y="88" width="28" height="22" rx="3"/>
    <rect x="95" y="115" width="28" height="22" rx="3"/><rect x="128" y="115" width="28" height="22" rx="3" fill="#67a7ff"/><rect x="161" y="115" width="28" height="22" rx="3"/><rect x="194" y="115" width="28" height="22" rx="3" fill="#67a7ff"/>
    <rect x="95" y="142" width="28" height="22" rx="3" fill="#67a7ff"/><rect x="128" y="142" width="28" height="22" rx="3"/><rect x="161" y="142" width="28" height="22" rx="3"/><rect x="194" y="142" width="28" height="22" rx="3"/>
  </g>
  <text x="157" y="186" text-anchor="middle" fill="#555555" font-size="13" font-style="italic">fixed-size blocks, like a hard drive</text>
  <text x="45" y="220" fill="#333333" font-size="14"><tspan font-weight="700" fill="#1f5fd1">Access:</tspan> attached to one VM</text>
  <text x="45" y="248" fill="#333333" font-size="14"><tspan font-weight="700" fill="#1f5fd1">Azure:</tspan> Managed Disks</text>
  <text x="45" y="276" fill="#333333" font-size="14"><tspan font-weight="700" fill="#1f5fd1">AWS:</tspan> EBS</text>
  <text x="45" y="304" fill="#333333" font-size="14"><tspan font-weight="700" fill="#1f5fd1">Best for:</tspan> OS disks, databases</text>

  <!-- File -->
  <rect x="320" y="20" width="265" height="320" rx="16" fill="#ffffff" stroke="#16a085" stroke-width="3"/>
  <rect x="320" y="20" width="265" height="50" rx="16" fill="#16a085"/><rect x="320" y="50" width="265" height="20" fill="#16a085"/>
  <text x="452" y="53" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">File Storage</text>
  <path d="M395 92 h40 l10 10 h65 v62 h-115 z" fill="#16a085"/>
  <g stroke="#16a085" stroke-width="3" fill="none"><path d="M520 110 h15 M520 110 v45 M520 132 h15 M520 155 h15"/></g>
  <rect x="538" y="102" width="22" height="16" rx="2" fill="#48c9b0"/><rect x="538" y="124" width="22" height="16" rx="2" fill="#48c9b0"/><rect x="538" y="147" width="22" height="16" rx="2" fill="#48c9b0"/>
  <text x="452" y="186" text-anchor="middle" fill="#555555" font-size="13" font-style="italic">folders and files, shared by many</text>
  <text x="340" y="220" fill="#333333" font-size="14"><tspan font-weight="700" fill="#16a085">Access:</tspan> SMB or NFS share</text>
  <text x="340" y="248" fill="#333333" font-size="14"><tspan font-weight="700" fill="#16a085">Azure:</tspan> Azure Files</text>
  <text x="340" y="276" fill="#333333" font-size="14"><tspan font-weight="700" fill="#16a085">AWS:</tspan> EFS</text>
  <text x="340" y="304" fill="#333333" font-size="14"><tspan font-weight="700" fill="#16a085">Best for:</tspan> shared folders, lift-and-shift</text>

  <!-- Object -->
  <rect x="615" y="20" width="265" height="320" rx="16" fill="#ffffff" stroke="#8e44ad" stroke-width="3"/>
  <rect x="615" y="20" width="265" height="50" rx="16" fill="#8e44ad"/><rect x="615" y="50" width="265" height="20" fill="#8e44ad"/>
  <text x="747" y="53" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">Object Storage</text>
  <g>
    <rect x="660" y="92" width="58" height="42" rx="10" fill="#8e44ad"/><rect x="666" y="138" width="46" height="8" rx="3" fill="#d2b4de"/>
    <rect x="728" y="100" width="58" height="42" rx="10" fill="#a569bd"/><rect x="734" y="146" width="46" height="8" rx="3" fill="#d2b4de"/>
    <rect x="796" y="88" width="48" height="48" rx="10" fill="#8e44ad"/><rect x="798" y="140" width="44" height="8" rx="3" fill="#d2b4de"/>
  </g>
  <text x="747" y="186" text-anchor="middle" fill="#555555" font-size="13" font-style="italic">objects with an ID and metadata</text>
  <text x="635" y="220" fill="#333333" font-size="14"><tspan font-weight="700" fill="#8e44ad">Access:</tspan> HTTPS and REST API</text>
  <text x="635" y="248" fill="#333333" font-size="14"><tspan font-weight="700" fill="#8e44ad">Azure:</tspan> Blob Storage</text>
  <text x="635" y="276" fill="#333333" font-size="14"><tspan font-weight="700" fill="#8e44ad">AWS:</tspan> S3</text>
  <text x="635" y="304" fill="#333333" font-size="14"><tspan font-weight="700" fill="#8e44ad">Best for:</tspan> media, backups, data lakes</text>

  <!-- Databases -->
  <rect x="910" y="20" width="265" height="320" rx="16" fill="#ffffff" stroke="#d35400" stroke-width="3"/>
  <rect x="910" y="20" width="265" height="50" rx="16" fill="#d35400"/><rect x="910" y="50" width="265" height="20" fill="#d35400"/>
  <text x="1042" y="53" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">Databases</text>
  <g>
    <rect x="1002" y="98" width="80" height="58" fill="#d35400"/>
    <ellipse cx="1042" cy="156" rx="40" ry="12" fill="#a04000"/>
    <ellipse cx="1042" cy="98" rx="40" ry="12" fill="#e67e22"/>
    <path d="M1002 118 a40 12 0 0 0 80 0 M1002 137 a40 12 0 0 0 80 0" fill="none" stroke="#f5cba7" stroke-width="2"/>
  </g>
  <text x="1042" y="186" text-anchor="middle" fill="#555555" font-size="13" font-style="italic">structured data you query</text>
  <text x="930" y="220" fill="#333333" font-size="14"><tspan font-weight="700" fill="#d35400">Relational:</tspan> tables and SQL</text>
  <text x="930" y="248" fill="#333333" font-size="14"><tspan font-weight="700" fill="#d35400">NoSQL:</tspan> documents, key-value</text>
  <text x="930" y="276" fill="#333333" font-size="14"><tspan font-weight="700" fill="#d35400">Azure:</tspan> SQL Database, Cosmos DB</text>
  <text x="930" y="304" fill="#333333" font-size="14"><tspan font-weight="700" fill="#d35400">AWS:</tspan> RDS, DynamoDB</text>

  <!-- ===== Row 2: access tiers ===== -->
  <text x="25" y="383" fill="#0b2e6b" font-size="19" font-weight="700">Access Tiers for Object Storage</text>
  <rect x="25" y="398" width="290" height="72" rx="12" fill="#e74c3c"/>
  <rect x="312" y="398" width="290" height="72" fill="#f39c12"/>
  <rect x="598" y="398" width="290" height="72" fill="#3498db"/>
  <rect x="885" y="398" width="290" height="72" rx="12" fill="#0b2e6b"/>
  <rect x="300" y="398" width="20" height="72" fill="#e74c3c"/>
  <rect x="880" y="398" width="20" height="72" fill="#0b2e6b"/>
  <text x="168" y="428" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Hot</text>
  <text x="168" y="452" text-anchor="middle" fill="#ffffff" font-size="14">accessed often</text>
  <text x="456" y="428" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Cool</text>
  <text x="456" y="452" text-anchor="middle" fill="#ffffff" font-size="14">stored 30+ days</text>
  <text x="743" y="428" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Cold</text>
  <text x="743" y="452" text-anchor="middle" fill="#ffffff" font-size="14">stored 90+ days</text>
  <text x="1030" y="428" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Archive</text>
  <text x="1030" y="452" text-anchor="middle" fill="#ffffff" font-size="14">180+ days, hours to restore</text>
  <text x="600" y="497" text-anchor="middle" fill="#333333" font-size="15">Moving right: <tspan font-weight="700" fill="#27ae60">lower storage cost</tspan>, but <tspan font-weight="700" fill="#c0392b">higher access cost and slower retrieval</tspan></text>

  <!-- ===== Row 3: redundancy vs backups ===== -->
  <rect x="25" y="525" width="565" height="200" rx="16" fill="#eef5ff" stroke="#c9daf5" stroke-width="2"/>
  <text x="45" y="557" fill="#0b2e6b" font-size="19" font-weight="700">Redundancy</text>
  <text x="165" y="557" fill="#555555" font-size="14" font-style="italic">copies the provider keeps</text>
  <rect x="45" y="575" width="165" height="125" rx="12" fill="#1f5fd1"/>
  <text x="127" y="610" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">LRS</text>
  <text x="127" y="638" text-anchor="middle" fill="#ffffff" font-size="13">3 copies in one</text>
  <text x="127" y="657" text-anchor="middle" fill="#ffffff" font-size="13">data center</text>
  <rect x="220" y="575" width="165" height="125" rx="12" fill="#0d47a1"/>
  <text x="302" y="610" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">ZRS</text>
  <text x="302" y="638" text-anchor="middle" fill="#ffffff" font-size="13">copies across</text>
  <text x="302" y="657" text-anchor="middle" fill="#ffffff" font-size="13">availability zones</text>
  <rect x="395" y="575" width="175" height="125" rx="12" fill="#0b2e6b"/>
  <text x="482" y="610" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">GRS</text>
  <text x="482" y="638" text-anchor="middle" fill="#ffffff" font-size="13">copies in a</text>
  <text x="482" y="657" text-anchor="middle" fill="#ffffff" font-size="13">second region</text>

  <rect x="610" y="525" width="565" height="200" rx="16" fill="#edf8ee" stroke="#b9e3c6" stroke-width="2"/>
  <text x="630" y="557" fill="#1e8449" font-size="19" font-weight="700">Backups</text>
  <text x="722" y="557" fill="#555555" font-size="14" font-style="italic">copies you control</text>
  <rect x="630" y="575" width="165" height="125" rx="12" fill="#27ae60"/>
  <text x="712" y="610" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Snapshots</text>
  <text x="712" y="638" text-anchor="middle" fill="#ffffff" font-size="13">point-in-time copy</text>
  <text x="712" y="657" text-anchor="middle" fill="#ffffff" font-size="13">of a disk</text>
  <rect x="805" y="575" width="165" height="125" rx="12" fill="#1e8449"/>
  <text x="887" y="610" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Backup Service</text>
  <text x="887" y="638" text-anchor="middle" fill="#ffffff" font-size="13">scheduled copies</text>
  <text x="887" y="657" text-anchor="middle" fill="#ffffff" font-size="13">kept for set periods</text>
  <rect x="980" y="575" width="175" height="125" rx="12" fill="#145a32"/>
  <text x="1067" y="610" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">3-2-1 Rule</text>
  <text x="1067" y="638" text-anchor="middle" fill="#ffffff" font-size="13">3 copies, 2 media,</text>
  <text x="1067" y="657" text-anchor="middle" fill="#ffffff" font-size="13">1 off-site</text>

  <text x="600" y="755" text-anchor="middle" fill="#c0392b" font-size="16" font-weight="700">Redundancy is not a backup: a file deleted by mistake is deleted in every redundant copy.</text>
</svg>
