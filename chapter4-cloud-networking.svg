<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Cloud networking in action</title>
  <desc id="d">Students, faculty and mobile users reach a load balancer inside an Azure virtual network, which distributes traffic to two web apps backed by a database. A campus LAN connects for application connectivity and a VPN provides secure connectivity.</desc>
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67a7ff"/>
      <stop offset="100%" stop-color="#1f5fd1"/>
    </linearGradient>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#27ae60"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#f39c12"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#8e44ad"/></marker>
    <marker id="arrowWhite" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#ffffff"/></marker>
  </defs>

  <!-- Azure VNet (taller so the database sits inside it) -->
  <rect x="400" y="130" width="400" height="410" rx="20" fill="url(#cloudGradient)"/>
  <text x="600" y="170" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold">Azure Virtual Network</text>

  <!-- Internal flow: load balancer to web apps to database -->
  <line x1="575" y1="272" x2="545" y2="306" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowWhite)"/>
  <line x1="625" y1="272" x2="655" y2="306" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowWhite)"/>
  <line x1="535" y1="380" x2="570" y2="418" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowWhite)"/>
  <line x1="675" y1="380" x2="630" y2="418" stroke="#ffffff" stroke-width="3" marker-end="url(#arrowWhite)"/>

  <!-- Load Balancer -->
  <circle cx="600" cy="230" r="45" fill="#f39c12"/>
  <text x="600" y="226" text-anchor="middle" font-size="15" fill="#ffffff">Load</text>
  <text x="600" y="244" text-anchor="middle" font-size="15" fill="#ffffff">Balancer</text>

  <!-- Web Apps -->
  <rect x="480" y="310" width="110" height="70" rx="12" fill="#2ecc71"/>
  <text x="535" y="351" text-anchor="middle" fill="#ffffff" font-size="17">Web App</text>
  <rect x="620" y="310" width="110" height="70" rx="12" fill="#2ecc71"/>
  <text x="675" y="351" text-anchor="middle" fill="#ffffff" font-size="17">Web App</text>

  <!-- Database -->
  <ellipse cx="600" cy="430" rx="70" ry="25" fill="#8e44ad"/>
  <rect x="530" y="430" width="140" height="60" fill="#8e44ad"/>
  <ellipse cx="600" cy="490" rx="70" ry="25" fill="#71368d"/>
  <ellipse cx="600" cy="430" rx="70" ry="25" fill="#9b59b6"/>
  <text x="600" y="472" text-anchor="middle" fill="#ffffff" font-size="17">Database</text>

  <!-- Users -->
  <circle cx="120" cy="180" r="45" fill="#27ae60"/>
  <text x="120" y="186" text-anchor="middle" fill="#ffffff" font-size="16">Student</text>
  <circle cx="120" cy="350" r="45" fill="#3498db"/>
  <text x="120" y="356" text-anchor="middle" fill="#ffffff" font-size="16">Faculty</text>
  <circle cx="120" cy="520" r="45" fill="#9b59b6"/>
  <text x="120" y="526" text-anchor="middle" fill="#ffffff" font-size="16">Mobile</text>

  <!-- Campus LAN -->
  <rect x="930" y="250" width="180" height="110" rx="12" fill="#e74c3c"/>
  <text x="1020" y="313" text-anchor="middle" fill="#ffffff" font-size="24">Campus LAN</text>

  <!-- VPN -->
  <circle cx="1070" cy="110" r="45" fill="#16a085"/>
  <text x="1070" y="117" text-anchor="middle" fill="#ffffff" font-size="18">VPN</text>

  <!-- User access traffic -->
  <line x1="165" y1="180" x2="400" y2="210" stroke="#27ae60" stroke-width="6" marker-end="url(#arrowGreen)"/>
  <line x1="165" y1="350" x2="400" y2="270" stroke="#27ae60" stroke-width="6" marker-end="url(#arrowGreen)"/>
  <line x1="165" y1="520" x2="400" y2="350" stroke="#27ae60" stroke-width="6" marker-end="url(#arrowGreen)"/>

  <!-- Campus application connectivity -->
  <line x1="1020" y1="250" x2="800" y2="215" stroke="#f39c12" stroke-width="6" marker-end="url(#arrowOrange)"/>

  <!-- Secure VPN connectivity -->
  <line x1="1025" y1="118" x2="800" y2="160" stroke="#8e44ad" stroke-width="6" marker-end="url(#arrowPurple)"/>

  <!-- Labels -->
  <text x="190" y="150" fill="#27ae60" font-size="18" font-weight="600">User Access Traffic</text>
  <text x="845" y="205" fill="#d68910" font-size="18" font-weight="600">Application Connectivity</text>
  <text x="790" y="95" fill="#8e44ad" font-size="18" font-weight="600">Secure VPN Connectivity</text>
</svg>
