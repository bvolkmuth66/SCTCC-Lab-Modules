<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">From telemetry to action: cloud observability</title>
  <desc id="d">Sources, including virtual machines, applications, databases, the network, and cloud platform activity, produce four kinds of telemetry. Metrics are numbers measured over time, such as CPU percentage. Logs are time-stamped records of what happened, such as an error message. Traces follow a single request across services to show where time was spent. Events are notable changes, such as a VM restart or a configuration change. Telemetry flows into a monitoring platform, Azure Monitor with Log Analytics and Application Insights, or on AWS, CloudWatch, CloudTrail, and X-Ray. The platform drives dashboards, alerts, automated responses such as autoscaling or runbooks, and log queries. Below, a troubleshooting loop runs from detect to investigate to fix to verify, then back to detect.</desc>
  <defs>
    <marker id="aBlue" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 6, 0 12" fill="#1f5fd1"/></marker>
    <marker id="aGray" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 6, 0 12" fill="#5d6d7e"/></marker>
  </defs>

  <!-- Column headings -->
  <text x="120" y="38" text-anchor="middle" fill="#0b2e6b" font-size="19" font-weight="700">Sources</text>
  <text x="455" y="38" text-anchor="middle" fill="#0b2e6b" font-size="19" font-weight="700">Telemetry</text>
  <text x="795" y="38" text-anchor="middle" fill="#0b2e6b" font-size="19" font-weight="700">Collect and Analyze</text>
  <text x="1067" y="38" text-anchor="middle" fill="#0b2e6b" font-size="19" font-weight="700">Act on It</text>

  <!-- Arrows between columns -->
  <line x1="220" y1="295" x2="282" y2="295" stroke="#1f5fd1" stroke-width="6" marker-end="url(#aBlue)"/>
  <line x1="625" y1="295" x2="687" y2="295" stroke="#1f5fd1" stroke-width="6" marker-end="url(#aBlue)"/>
  <line x1="900" y1="120" x2="955" y2="120" stroke="#1f5fd1" stroke-width="4" marker-end="url(#aBlue)"/>
  <line x1="900" y1="235" x2="955" y2="235" stroke="#1f5fd1" stroke-width="4" marker-end="url(#aBlue)"/>
  <line x1="900" y1="350" x2="955" y2="350" stroke="#1f5fd1" stroke-width="4" marker-end="url(#aBlue)"/>
  <line x1="900" y1="465" x2="955" y2="465" stroke="#1f5fd1" stroke-width="4" marker-end="url(#aBlue)"/>

  <!-- Sources -->
  <g font-size="15" font-weight="600" text-anchor="middle" fill="#ffffff">
    <rect x="25" y="70" width="190" height="72" rx="12" fill="#5d6d7e"/><text x="120" y="112">Virtual Machines</text>
    <rect x="25" y="160" width="190" height="72" rx="12" fill="#5d6d7e"/><text x="120" y="202">Applications</text>
    <rect x="25" y="250" width="190" height="72" rx="12" fill="#5d6d7e"/><text x="120" y="292">Databases</text>
    <rect x="25" y="340" width="190" height="72" rx="12" fill="#5d6d7e"/><text x="120" y="382">Network</text>
    <rect x="25" y="430" width="190" height="85" rx="12" fill="#5d6d7e"/><text x="120" y="467">Cloud Platform</text><text x="120" y="490" font-size="13" font-weight="400">who changed what</text>
  </g>

  <!-- Telemetry cards -->
  <!-- Metrics -->
  <rect x="290" y="70" width="330" height="100" rx="14" fill="#1f5fd1"/>
  <text x="308" y="100" fill="#ffffff" font-size="19" font-weight="700">Metrics</text>
  <text x="308" y="124" fill="#e3edff" font-size="13">numbers over time</text>
  <text x="308" y="148" fill="#e3edff" font-size="13" font-style="italic">CPU at 85%</text>
  <rect x="470" y="85" width="135" height="70" rx="8" fill="#ffffff" fill-opacity="0.15"/>
  <polyline points="478,140 495,132 510,136 525,118 540,124 555,104 570,110 585,96 598,100" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <line x1="478" y1="108" x2="598" y2="108" stroke="#f39c12" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Logs -->
  <rect x="290" y="185" width="330" height="100" rx="14" fill="#16a085"/>
  <text x="308" y="215" fill="#ffffff" font-size="19" font-weight="700">Logs</text>
  <text x="308" y="239" fill="#e8fff8" font-size="13">time-stamped records</text>
  <text x="308" y="263" fill="#e8fff8" font-size="13" font-style="italic">10:42 ERROR login failed</text>
  <rect x="470" y="200" width="135" height="70" rx="8" fill="#ffffff" fill-opacity="0.15"/>
  <g fill="#ffffff"><rect x="480" y="210" width="28" height="7" rx="2" fill-opacity="0.6"/><rect x="513" y="210" width="80" height="7" rx="2"/>
  <rect x="480" y="226" width="28" height="7" rx="2" fill-opacity="0.6"/><rect x="513" y="226" width="62" height="7" rx="2"/>
  <rect x="480" y="242" width="28" height="7" rx="2" fill-opacity="0.6"/><rect x="513" y="242" width="72" height="7" rx="2" fill="#f5b7b1"/>
  <rect x="480" y="258" width="28" height="7" rx="2" fill-opacity="0.6"/><rect x="513" y="258" width="50" height="7" rx="2"/></g>

  <!-- Traces -->
  <rect x="290" y="300" width="330" height="100" rx="14" fill="#8e44ad"/>
  <text x="308" y="330" fill="#ffffff" font-size="19" font-weight="700">Traces</text>
  <text x="308" y="354" fill="#f3e5fb" font-size="13">one request, end to end</text>
  <text x="308" y="378" fill="#f3e5fb" font-size="13" font-style="italic">database call took 2.1 s</text>
  <rect x="470" y="315" width="135" height="70" rx="8" fill="#ffffff" fill-opacity="0.15"/>
  <g><rect x="478" y="324" width="118" height="9" rx="3" fill="#ffffff"/>
  <rect x="490" y="339" width="40" height="9" rx="3" fill="#d2b4de"/>
  <rect x="532" y="354" width="58" height="9" rx="3" fill="#f5b7b1"/>
  <rect x="540" y="369" width="22" height="9" rx="3" fill="#d2b4de"/></g>

  <!-- Events -->
  <rect x="290" y="415" width="330" height="100" rx="14" fill="#d35400"/>
  <text x="308" y="445" fill="#ffffff" font-size="19" font-weight="700">Events</text>
  <text x="308" y="469" fill="#fdebd0" font-size="13">notable changes</text>
  <text x="308" y="493" fill="#fdebd0" font-size="13" font-style="italic">VM restart, rule change</text>
  <rect x="470" y="430" width="135" height="70" rx="8" fill="#ffffff" fill-opacity="0.15"/>
  <line x1="480" y1="472" x2="596" y2="472" stroke="#ffffff" stroke-width="3"/>
  <g fill="#ffffff"><circle cx="495" cy="472" r="6"/><circle cx="530" cy="472" r="6"/><circle cx="578" cy="472" r="6"/></g>
  <path d="M530 466 v-24 l16 6 l-16 6" fill="#f9e79f" stroke="#f9e79f" stroke-width="2"/>

  <!-- Platform -->
  <rect x="695" y="70" width="205" height="445" rx="18" fill="#0b2e6b"/>
  <text x="797" y="110" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Monitoring</text>
  <text x="797" y="134" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Platform</text>
  <rect x="712" y="160" width="171" height="155" rx="12" fill="#1f5fd1"/>
  <text x="797" y="190" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Azure</text>
  <text x="797" y="218" text-anchor="middle" fill="#ffffff" font-size="14">Azure Monitor</text>
  <text x="797" y="244" text-anchor="middle" fill="#ffffff" font-size="14">Log Analytics</text>
  <text x="797" y="270" text-anchor="middle" fill="#ffffff" font-size="14">Application</text>
  <text x="797" y="289" text-anchor="middle" fill="#ffffff" font-size="14">Insights</text>
  <rect x="712" y="330" width="171" height="135" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#67a7ff" stroke-width="2"/>
  <text x="797" y="360" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">AWS</text>
  <text x="797" y="388" text-anchor="middle" fill="#dbe7ff" font-size="14">CloudWatch</text>
  <text x="797" y="414" text-anchor="middle" fill="#dbe7ff" font-size="14">CloudTrail</text>
  <text x="797" y="440" text-anchor="middle" fill="#dbe7ff" font-size="14">X-Ray</text>
  <text x="797" y="495" text-anchor="middle" fill="#cfe0ff" font-size="13" font-style="italic">stores and correlates data</text>

  <!-- Actions -->
  <g>
    <rect x="960" y="78" width="215" height="84" rx="12" fill="#27ae60"/>
    <text x="1067" y="112" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Dashboards</text>
    <text x="1067" y="136" text-anchor="middle" fill="#ffffff" font-size="13">health at a glance</text>
    <rect x="960" y="193" width="215" height="84" rx="12" fill="#e74c3c"/>
    <text x="1067" y="227" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Alerts</text>
    <text x="1067" y="251" text-anchor="middle" fill="#ffffff" font-size="13">notify when a threshold is crossed</text>
    <rect x="960" y="308" width="215" height="84" rx="12" fill="#f39c12"/>
    <text x="1067" y="342" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Automated Response</text>
    <text x="1067" y="366" text-anchor="middle" fill="#ffffff" font-size="13">autoscale or run a runbook</text>
    <rect x="960" y="423" width="215" height="84" rx="12" fill="#8e44ad"/>
    <text x="1067" y="457" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Log Queries</text>
    <text x="1067" y="481" text-anchor="middle" fill="#ffffff" font-size="13">search to find the cause</text>
  </g>

  <!-- Troubleshooting loop -->
  <rect x="25" y="555" width="1150" height="170" rx="18" fill="#eef5ff" stroke="#c9daf5" stroke-width="2"/>
  <text x="50" y="590" fill="#0b2e6b" font-size="19" font-weight="700">Troubleshooting Loop</text>
  <g stroke="#5d6d7e" stroke-width="4">
    <line x1="315" y1="650" x2="365" y2="650" marker-end="url(#aGray)"/>
    <line x1="590" y1="650" x2="640" y2="650" marker-end="url(#aGray)"/>
    <line x1="865" y1="650" x2="915" y2="650" marker-end="url(#aGray)"/>
  </g>
  <polyline points="1032,688 1032,708 177,708 177,694" fill="none" stroke="#5d6d7e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#aGray)"/>
  <g text-anchor="middle">
    <rect x="45" y="610" width="265" height="80" rx="12" fill="#e74c3c"/>
    <text x="177" y="643" fill="#ffffff" font-size="17" font-weight="700">1 Detect</text>
    <text x="177" y="667" fill="#ffffff" font-size="13">an alert fires or users report it</text>
    <rect x="370" y="610" width="215" height="80" rx="12" fill="#8e44ad"/>
    <text x="477" y="643" fill="#ffffff" font-size="17" font-weight="700">2 Investigate</text>
    <text x="477" y="667" fill="#ffffff" font-size="13">metrics, logs, traces</text>
    <rect x="645" y="610" width="215" height="80" rx="12" fill="#f39c12"/>
    <text x="752" y="643" fill="#ffffff" font-size="17" font-weight="700">3 Fix</text>
    <text x="752" y="667" fill="#ffffff" font-size="13">change or roll back</text>
    <rect x="920" y="610" width="225" height="80" rx="12" fill="#27ae60"/>
    <text x="1032" y="643" fill="#ffffff" font-size="17" font-weight="700">4 Verify</text>
    <text x="1032" y="667" fill="#ffffff" font-size="13">metrics back to normal</text>
  </g>
</svg>
