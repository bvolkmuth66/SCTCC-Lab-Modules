<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Cloud computing at a glance</title>
  <desc id="d">Left: the five essential characteristics of cloud computing: on-demand self-service, broad network access, resource pooling, rapid elasticity, and measured service. Center: a chart of who manages each layer. On-premises, you manage everything. In IaaS, you manage applications, data, runtime, and the operating system, and the provider manages virtualization, servers, storage, and networking. In PaaS, you manage applications and data, and the provider manages the rest. In SaaS, the provider manages every layer. Right: four deployment models: public, private, hybrid, and community, plus multi-cloud, which uses more than one provider. Bottom: major cloud providers are Amazon Web Services, Microsoft Azure, and Google Cloud.</desc>

  <text x="200" y="42" text-anchor="middle" fill="#0b2e6b" font-size="19" font-weight="700">Five Essential Characteristics</text>
  <text x="622" y="42" text-anchor="middle" fill="#0b2e6b" font-size="19" font-weight="700">Service Models: Who Manages What</text>
  <text x="1025" y="42" text-anchor="middle" fill="#0b2e6b" font-size="19" font-weight="700">Deployment Models</text>
  <rect x="25" y="65" width="350" height="92" rx="14" fill="#ffffff" stroke="#1f5fd1" stroke-width="2.5"/>
  <rect x="25" y="65" width="14" height="92" rx="7" fill="#1f5fd1"/><rect x="32" y="65" width="8" height="92" fill="#1f5fd1"/>
  <text x="60" y="105" fill="#1f5fd1" font-size="18" font-weight="700">On-Demand Self-Service</text>
  <text x="60" y="131" fill="#333333" font-size="15">create resources yourself, anytime</text>
  <rect x="25" y="170" width="350" height="92" rx="14" fill="#ffffff" stroke="#16a085" stroke-width="2.5"/>
  <rect x="25" y="170" width="14" height="92" rx="7" fill="#16a085"/><rect x="32" y="170" width="8" height="92" fill="#16a085"/>
  <text x="60" y="210" fill="#16a085" font-size="18" font-weight="700">Broad Network Access</text>
  <text x="60" y="236" fill="#333333" font-size="15">reach services from any device</text>
  <rect x="25" y="275" width="350" height="92" rx="14" fill="#ffffff" stroke="#8e44ad" stroke-width="2.5"/>
  <rect x="25" y="275" width="14" height="92" rx="7" fill="#8e44ad"/><rect x="32" y="275" width="8" height="92" fill="#8e44ad"/>
  <text x="60" y="315" fill="#8e44ad" font-size="18" font-weight="700">Resource Pooling</text>
  <text x="60" y="341" fill="#333333" font-size="15">shared hardware serves many customers</text>
  <rect x="25" y="380" width="350" height="92" rx="14" fill="#ffffff" stroke="#d35400" stroke-width="2.5"/>
  <rect x="25" y="380" width="14" height="92" rx="7" fill="#d35400"/><rect x="32" y="380" width="8" height="92" fill="#d35400"/>
  <text x="60" y="420" fill="#d35400" font-size="18" font-weight="700">Rapid Elasticity</text>
  <text x="60" y="446" fill="#333333" font-size="15">scale up or down in minutes</text>
  <rect x="25" y="485" width="350" height="92" rx="14" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="25" y="485" width="14" height="92" rx="7" fill="#c0392b"/><rect x="32" y="485" width="8" height="92" fill="#c0392b"/>
  <text x="60" y="525" fill="#c0392b" font-size="18" font-weight="700">Measured Service</text>
  <text x="60" y="551" fill="#333333" font-size="15">pay only for what you use</text>
  <rect x="400" y="65" width="453" height="358" rx="12" fill="#f4f7fb"/>
  <text x="566.0" y="95" text-anchor="middle" fill="#0b2e6b" font-size="16" font-weight="700">On-Prem</text>
  <text x="648.0" y="95" text-anchor="middle" fill="#0b2e6b" font-size="16" font-weight="700">IaaS</text>
  <text x="730.0" y="95" text-anchor="middle" fill="#0b2e6b" font-size="16" font-weight="700">PaaS</text>
  <text x="812.0" y="95" text-anchor="middle" fill="#0b2e6b" font-size="16" font-weight="700">SaaS</text>
  <text x="515" y="134" text-anchor="end" fill="#333333" font-size="14">Applications</text>
  <rect x="529" y="113" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="611" y="113" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="693" y="113" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="775" y="113" width="74" height="32" rx="6" fill="#aab7c4"/>
  <text x="515" y="172" text-anchor="end" fill="#333333" font-size="14">Data</text>
  <rect x="529" y="151" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="611" y="151" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="693" y="151" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="775" y="151" width="74" height="32" rx="6" fill="#aab7c4"/>
  <text x="515" y="210" text-anchor="end" fill="#333333" font-size="14">Runtime</text>
  <rect x="529" y="189" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="611" y="189" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="693" y="189" width="74" height="32" rx="6" fill="#aab7c4"/>
  <rect x="775" y="189" width="74" height="32" rx="6" fill="#aab7c4"/>
  <text x="515" y="248" text-anchor="end" fill="#333333" font-size="14">Operating System</text>
  <rect x="529" y="227" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="611" y="227" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="693" y="227" width="74" height="32" rx="6" fill="#aab7c4"/>
  <rect x="775" y="227" width="74" height="32" rx="6" fill="#aab7c4"/>
  <text x="515" y="286" text-anchor="end" fill="#333333" font-size="14">Virtualization</text>
  <rect x="529" y="265" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="611" y="265" width="74" height="32" rx="6" fill="#aab7c4"/>
  <rect x="693" y="265" width="74" height="32" rx="6" fill="#aab7c4"/>
  <rect x="775" y="265" width="74" height="32" rx="6" fill="#aab7c4"/>
  <text x="515" y="324" text-anchor="end" fill="#333333" font-size="14">Servers</text>
  <rect x="529" y="303" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="611" y="303" width="74" height="32" rx="6" fill="#aab7c4"/>
  <rect x="693" y="303" width="74" height="32" rx="6" fill="#aab7c4"/>
  <rect x="775" y="303" width="74" height="32" rx="6" fill="#aab7c4"/>
  <text x="515" y="362" text-anchor="end" fill="#333333" font-size="14">Storage</text>
  <rect x="529" y="341" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="611" y="341" width="74" height="32" rx="6" fill="#aab7c4"/>
  <rect x="693" y="341" width="74" height="32" rx="6" fill="#aab7c4"/>
  <rect x="775" y="341" width="74" height="32" rx="6" fill="#aab7c4"/>
  <text x="515" y="400" text-anchor="end" fill="#333333" font-size="14">Networking</text>
  <rect x="529" y="379" width="74" height="32" rx="6" fill="#1f5fd1"/>
  <rect x="611" y="379" width="74" height="32" rx="6" fill="#aab7c4"/>
  <rect x="693" y="379" width="74" height="32" rx="6" fill="#aab7c4"/>
  <rect x="775" y="379" width="74" height="32" rx="6" fill="#aab7c4"/>
  <rect x="529" y="430" width="22" height="16" rx="4" fill="#1f5fd1"/><text x="557" y="444" fill="#333333" font-size="14">You manage</text>
  <rect x="665" y="430" width="22" height="16" rx="4" fill="#aab7c4"/><text x="693" y="444" fill="#333333" font-size="14">Provider manages</text>
  <text x="566.0" y="478" text-anchor="middle" fill="#555555" font-size="12.5" font-style="italic">your own</text><text x="566.0" y="495" text-anchor="middle" fill="#555555" font-size="12.5" font-style="italic">data center</text>
  <text x="648.0" y="478" text-anchor="middle" fill="#555555" font-size="12.5" font-style="italic">virtual</text><text x="648.0" y="495" text-anchor="middle" fill="#555555" font-size="12.5" font-style="italic">machines</text>
  <text x="730.0" y="478" text-anchor="middle" fill="#555555" font-size="12.5" font-style="italic">app</text><text x="730.0" y="495" text-anchor="middle" fill="#555555" font-size="12.5" font-style="italic">platforms</text>
  <text x="812.0" y="478" text-anchor="middle" fill="#555555" font-size="12.5" font-style="italic">Microsoft 365,</text><text x="812.0" y="495" text-anchor="middle" fill="#555555" font-size="12.5" font-style="italic">Gmail</text>
  <text x="515" y="487" text-anchor="end" fill="#0b2e6b" font-size="13" font-weight="700">Examples</text>
  <rect x="875" y="65" width="300" height="100" rx="14" fill="#1f5fd1"/>
  <text x="1025" y="101" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Public</text>
  <text x="1025" y="127" text-anchor="middle" fill="#ffffff" font-size="14">provider's shared infrastructure,</text>
  <text x="1025" y="146" text-anchor="middle" fill="#ffffff" font-size="14">open to any customer</text>
  <rect x="875" y="177" width="300" height="100" rx="14" fill="#0b2e6b"/>
  <text x="1025" y="213" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Private</text>
  <text x="1025" y="239" text-anchor="middle" fill="#ffffff" font-size="14">dedicated to one organization,</text>
  <text x="1025" y="258" text-anchor="middle" fill="#ffffff" font-size="14">on-site or hosted</text>
  <rect x="875" y="289" width="300" height="100" rx="14" fill="#16a085"/>
  <text x="1025" y="325" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Hybrid</text>
  <text x="1025" y="351" text-anchor="middle" fill="#ffffff" font-size="14">public and private connected,</text>
  <text x="1025" y="370" text-anchor="middle" fill="#ffffff" font-size="14">working as one</text>
  <rect x="875" y="401" width="300" height="100" rx="14" fill="#8e44ad"/>
  <text x="1025" y="437" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Community</text>
  <text x="1025" y="463" text-anchor="middle" fill="#ffffff" font-size="14">shared by organizations with</text>
  <text x="1025" y="482" text-anchor="middle" fill="#ffffff" font-size="14">common needs, such as colleges</text>
  <text x="1025" y="535" text-anchor="middle" fill="#333333" font-size="14"><tspan font-weight="700" fill="#d35400">Multi-cloud:</tspan> using more than one provider</text>
  <rect x="25" y="600" width="1150" height="100" rx="18" fill="#0b2e6b"/>
  <text x="50" y="657" fill="#ffffff" font-size="19" font-weight="700">Major Cloud Providers</text>
  <rect x="285" y="622" width="210" height="56" rx="28" fill="#ffffff"/><text x="390" y="657" text-anchor="middle" fill="#0b2e6b" font-size="17" font-weight="700">Amazon Web Services</text>
  <rect x="505" y="622" width="210" height="56" rx="28" fill="#ffffff"/><text x="610" y="657" text-anchor="middle" fill="#0b2e6b" font-size="17" font-weight="700">Microsoft Azure</text>
  <rect x="725" y="622" width="210" height="56" rx="28" fill="#ffffff"/><text x="830" y="657" text-anchor="middle" fill="#0b2e6b" font-size="17" font-weight="700">Google Cloud</text>
  <text x="1058" y="648" text-anchor="middle" fill="#dbe7ff" font-size="13">plus Oracle Cloud,</text><text x="1058" y="667" text-anchor="middle" fill="#dbe7ff" font-size="13">IBM Cloud, and others</text>
</svg>
