<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Defense in depth for cloud resources</title>
  <desc id="d">Four common threats, stolen credentials, DDoS attacks, malware and unpatched systems, and data exposure, are stopped at the edge of layered cloud defenses. The outer layer is identity and access, with multifactor authentication, IAM roles and least privilege. Inside it is the network layer, with security groups, firewalls, a web application firewall and DDoS protection. Next is the compute layer, with patching, hardening and endpoint protection. At the center is the data layer, with encryption at rest and in transit, key management and backups. Monitoring and logging runs beneath every layer.</desc>

  <!-- Column headings -->
  <text x="140" y="40" text-anchor="middle" fill="#c0392b" font-size="21" font-weight="700">Common Threats</text>
  <text x="750" y="40" text-anchor="middle" fill="#0b2e6b" font-size="21" font-weight="700">Defense in Depth</text>

  <!-- Layers (outer to inner) -->
  <rect x="330" y="60" width="840" height="575" rx="26" fill="#0b2e6b"/>
  <text x="360" y="95" fill="#ffffff" font-size="20" font-weight="700">Identity and Access</text>
  <text x="360" y="120" fill="#dbe7ff" font-size="15">Multifactor authentication, IAM roles, least privilege, conditional access</text>

  <rect x="375" y="140" width="750" height="455" rx="22" fill="#1f5fd1"/>
  <text x="405" y="175" fill="#ffffff" font-size="20" font-weight="700">Network</text>
  <text x="405" y="200" fill="#e3edff" font-size="15">Security groups, firewalls, web application firewall, DDoS protection, private endpoints</text>

  <rect x="420" y="220" width="660" height="335" rx="18" fill="#16a085"/>
  <text x="450" y="255" fill="#ffffff" font-size="20" font-weight="700">Compute</text>
  <text x="450" y="280" fill="#e8fff8" font-size="15">Patching, hardened images, endpoint protection, disabling unused ports and services</text>

  <rect x="465" y="300" width="570" height="215" rx="16" fill="#8e44ad"/>
  <text x="750" y="350" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">Data</text>
  <text x="750" y="390" text-anchor="middle" fill="#ffffff" font-size="17">Encryption at rest and in transit</text>
  <text x="750" y="418" text-anchor="middle" fill="#ffffff" font-size="17">Key management and access policies</text>
  <text x="750" y="446" text-anchor="middle" fill="#ffffff" font-size="17">Classification and backups</text>
  <text x="750" y="488" text-anchor="middle" fill="#f3e5fb" font-size="14" font-style="italic">The asset every outer layer protects</text>

  <!-- Threats -->
  <g>
    <rect x="25" y="75" width="230" height="105" rx="14" fill="#e74c3c"/>
    <text x="140" y="113" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Stolen Credentials</text>
    <text x="140" y="140" text-anchor="middle" fill="#ffffff" font-size="14">Stopped by MFA and</text>
    <text x="140" y="160" text-anchor="middle" fill="#ffffff" font-size="14">least privilege</text>

    <rect x="25" y="210" width="230" height="105" rx="14" fill="#e74c3c"/>
    <text x="140" y="248" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">DDoS Attack</text>
    <text x="140" y="275" text-anchor="middle" fill="#ffffff" font-size="14">Stopped by DDoS protection</text>
    <text x="140" y="295" text-anchor="middle" fill="#ffffff" font-size="14">and a web app firewall</text>

    <rect x="25" y="345" width="230" height="105" rx="14" fill="#e74c3c"/>
    <text x="140" y="383" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Malware and</text>
    <text x="140" y="405" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Unpatched Systems</text>
    <text x="140" y="432" text-anchor="middle" fill="#ffffff" font-size="13">Stopped by patching and hardening</text>

    <rect x="25" y="480" width="230" height="105" rx="14" fill="#e74c3c"/>
    <text x="140" y="518" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Data Exposure</text>
    <text x="140" y="545" text-anchor="middle" fill="#ffffff" font-size="14">Stopped by encryption</text>
    <text x="140" y="565" text-anchor="middle" fill="#ffffff" font-size="14">and access policies</text>
  </g>

  <!-- Blocked attack arrows -->
  <g stroke="#c0392b" stroke-width="5" stroke-linecap="round">
    <line x1="255" y1="127" x2="300" y2="127"/>
    <line x1="255" y1="262" x2="300" y2="262"/>
    <line x1="255" y1="397" x2="300" y2="397"/>
    <line x1="255" y1="532" x2="300" y2="532"/>
  </g>
  <g fill="#ffffff" stroke="#c0392b" stroke-width="4">
    <circle cx="312" cy="127" r="14"/>
    <circle cx="312" cy="262" r="14"/>
    <circle cx="312" cy="397" r="14"/>
    <circle cx="312" cy="532" r="14"/>
  </g>
  <g stroke="#c0392b" stroke-width="4" stroke-linecap="round">
    <path d="M305 120 L319 134 M319 120 L305 134"/>
    <path d="M305 255 L319 269 M319 255 L305 269"/>
    <path d="M305 390 L319 404 M319 390 L305 404"/>
    <path d="M305 525 L319 539 M319 525 L305 539"/>
  </g>

  <!-- Monitoring bar -->
  <rect x="25" y="660" width="1145" height="55" rx="14" fill="#34495e"/>
  <text x="597" y="694" text-anchor="middle" fill="#ffffff" font-size="18"><tspan font-weight="700">Monitoring and Logging</tspan> across every layer: audit logs, alerts, and security information and event management (SIEM)</text>
</svg>
