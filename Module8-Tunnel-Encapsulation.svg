<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 636" width="100%" style="max-width:560px;height:auto;display:block;margin:0 auto;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="30" y="46" text-anchor="start" font-family="Arial" font-size="14" font-weight="bold" fill="#004a99">1.  The host sends an ordinary packet</text><text x="30" y="142" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">Private source and destination addresses, routable only inside the two sites.</text>
<rect x="30" y="56" width="280" height="48" rx="3" fill="#ffffff" stroke="#9db4d0" stroke-width="1.3"/>
<text x="170.0" y="76" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#333333">inner IP header</text>
<text x="170.0" y="93" text-anchor="middle" font-family="Courier New, monospace" font-size="11.5" font-weight="normal" fill="#6b6b6b">192.168.10.25 > 192.168.40.50</text>
<rect x="310" y="56" width="220" height="48" rx="3" fill="#f4f7fb" stroke="#9db4d0" stroke-width="1.3"/>
<text x="420.0" y="84.5" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#333333">payload</text>
<line x1="280" y1="128" x2="280" y2="144" stroke="#7a8794" stroke-width="1.8"/><polygon points="274,144 286,144 280,152" fill="#7a8794"/>
<text x="30" y="178" text-anchor="start" font-family="Arial" font-size="14" font-weight="bold" fill="#004a99">2.  GRE adds a tunnel header</text><text x="30" y="274" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">GRE carries any protocol, including the multicast a routing protocol needs.</text>
<rect x="30" y="188" width="90" height="48" rx="3" fill="#eef3fa" stroke="#004a99" stroke-width="1.3"/>
<text x="75.0" y="216.5" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#004a99">GRE</text>
<rect x="120" y="188" width="230" height="48" rx="3" fill="#ffffff" stroke="#9db4d0" stroke-width="1.3"/>
<text x="235.0" y="216.5" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#333333">inner IP header</text>
<rect x="350" y="188" width="180" height="48" rx="3" fill="#f4f7fb" stroke="#9db4d0" stroke-width="1.3"/>
<text x="440.0" y="216.5" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#333333">payload</text>
<line x1="280" y1="260" x2="280" y2="276" stroke="#7a8794" stroke-width="1.8"/><polygon points="274,276 286,276 280,284" fill="#7a8794"/>
<text x="30" y="310" text-anchor="start" font-family="Arial" font-size="14" font-weight="bold" fill="#004a99">3.  IPsec encrypts and authenticates</text><text x="30" y="406" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">Everything between the ESP header and trailer is unreadable in transit.</text>
<rect x="30" y="320" width="76" height="48" rx="3" fill="#f2f8f3" stroke="#1a7a34" stroke-width="1.3"/>
<text x="68.0" y="348.5" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1a7a34">ESP hdr</text>
<rect x="106" y="320" width="348" height="48" rx="3" fill="#1a7a34" fill-opacity="0.12" stroke="#1a7a34" stroke-width="1.3"/>
<text x="280" y="344" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1a7a34">GRE + inner IP header + payload</text>
<text x="280" y="361" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="normal" fill="#6b6b6b">encrypted</text>
<rect x="454" y="320" width="76" height="48" rx="3" fill="#f2f8f3" stroke="#1a7a34" stroke-width="1.3"/>
<text x="492.0" y="348.5" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1a7a34">ESP auth</text>
<line x1="280" y1="392" x2="280" y2="408" stroke="#7a8794" stroke-width="1.8"/><polygon points="274,408 286,408 280,416" fill="#7a8794"/>
<text x="30" y="442" text-anchor="start" font-family="Arial" font-size="14" font-weight="bold" fill="#004a99">4.  A new outer header carries it across</text><text x="30" y="538" text-anchor="start" font-family="Arial" font-size="12.5" font-weight="normal" fill="#6b6b6b">These are the only addresses the provider ever reads.</text>
<rect x="30" y="452" width="210" height="48" rx="3" fill="#ffffff" stroke="#cc0000" stroke-width="1.3"/>
<text x="135.0" y="472" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#cc0000">outer IP header</text>
<text x="135.0" y="489" text-anchor="middle" font-family="Courier New, monospace" font-size="11.5" font-weight="normal" fill="#6b6b6b">209.165.200.225 > 209.165.201.1</text>
<rect x="240" y="452" width="290" height="48" rx="3" fill="#f4f7fb" stroke="#9db4d0" stroke-width="1.3"/>
<text x="385.0" y="480.5" text-anchor="middle" font-family="Arial" font-size="12.5" font-weight="bold" fill="#333333">ESP header, encrypted data, ESP auth</text>
<line x1="30" y1="566" x2="530" y2="566" stroke="#d9e1ea" stroke-width="1.3"/>
<text x="30" y="592" text-anchor="start" font-family="Arial" font-size="13" font-weight="normal" fill="#6b6b6b">The receiving router reverses every step: it authenticates and decrypts,</text>
<text x="30" y="612" text-anchor="start" font-family="Arial" font-size="13" font-weight="normal" fill="#6b6b6b">strips the GRE header, and forwards the original packet onto its own LAN.</text>
</svg>
