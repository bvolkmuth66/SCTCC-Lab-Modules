<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ways to connect to the cloud</title>
  <desc id="d">A campus data center and a branch office connect to an Azure hub virtual network through site-to-site VPN tunnels over the internet. A remote worker connects through a point-to-site VPN. The campus also has a private ExpressRoute circuit through a connectivity provider that bypasses the internet. Inside Azure, the hub virtual network holds a VPN gateway, an ExpressRoute gateway and a firewall, and is peered to two spoke virtual networks for web apps and databases.</desc>
  <defs>
    <linearGradient id="azure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67a7ff"/>
      <stop offset="100%" stop-color="#1f5fd1"/>
    </linearGradient>
    <marker id="aGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 4, 0 8" fill="#27ae60"/></marker>
    <marker id="aPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 4, 0 8" fill="#8e44ad"/></marker>
    <marker id="aOrange" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 12 6, 0 12" fill="#e67e22"/></marker>
  </defs>

  <!-- ===== Azure region and hub panel ===== -->
  <rect x="790" y="60" width="380" height="560" rx="20" fill="url(#azure)"/>
  <text x="980" y="40" text-anchor="middle" fill="#0b2e6b" font-size="20" font-weight="700">Microsoft Azure</text>

  <rect x="810" y="80" width="340" height="250" rx="16" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="2"/>
  <text x="980" y="112" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">Hub Virtual Network</text>

  <!-- ===== Connections ===== -->
  <!-- Site-to-site: campus and branch to internet -->
  <line x1="260" y1="140" x2="440" y2="215" stroke="#27ae60" stroke-width="5" stroke-dasharray="14 8"/>
  <line x1="260" y1="325" x2="440" y2="265" stroke="#27ae60" stroke-width="5" stroke-dasharray="14 8"/>
  <!-- Point-to-site: remote worker to internet -->
  <line x1="190" y1="470" x2="455" y2="285" stroke="#8e44ad" stroke-width="5" stroke-dasharray="4 7" stroke-linecap="round"/>
  <!-- Internet to VPN gateway (encrypted tunnels) -->
  <line x1="640" y1="240" x2="828" y2="200" stroke="#27ae60" stroke-width="5" stroke-dasharray="14 8" marker-end="url(#aGreen)"/>
  <line x1="630" y1="275" x2="828" y2="212" stroke="#8e44ad" stroke-width="5" stroke-dasharray="4 7" stroke-linecap="round" marker-end="url(#aPurple)"/>
  <!-- ExpressRoute: campus down to provider, provider to ER gateway -->
  <polyline points="40,140 20,140 20,560 455,560" fill="none" stroke="#e67e22" stroke-width="8" stroke-linejoin="round"/>
  <polyline points="645,560 775,560 775,278 828,278" fill="none" stroke="#e67e22" stroke-width="8" stroke-linejoin="round" marker-end="url(#aOrange)"/>

  <!-- ===== On-premises side ===== -->
  <text x="150" y="40" text-anchor="middle" fill="#0b2e6b" font-size="20" font-weight="700">On-Premises and Remote</text>

  <rect x="40" y="85" width="220" height="110" rx="14" fill="#e74c3c"/>
  <text x="150" y="133" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="600">Campus</text>
  <text x="150" y="160" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="600">Data Center</text>

  <rect x="40" y="280" width="220" height="90" rx="14" fill="#c0392b"/>
  <text x="150" y="332" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="600">Branch Office</text>

  <circle cx="150" cy="490" r="50" fill="#9b59b6"/>
  <text x="150" y="485" text-anchor="middle" fill="#ffffff" font-size="17">Remote</text>
  <text x="150" y="506" text-anchor="middle" fill="#ffffff" font-size="17">Worker</text>

  <!-- ===== Middle: internet and provider ===== -->
  <g>
    <ellipse cx="540" cy="250" rx="105" ry="62" fill="#95a5a6"/>
    <ellipse cx="490" cy="215" rx="55" ry="45" fill="#95a5a6"/>
    <ellipse cx="585" cy="210" rx="60" ry="48" fill="#95a5a6"/>
    <text x="540" y="252" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Public</text>
    <text x="540" y="278" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Internet</text>
  </g>

  <rect x="455" y="515" width="190" height="90" rx="14" fill="#f39c12"/>
  <text x="550" y="553" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Connectivity</text>
  <text x="550" y="577" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="600">Provider</text>

  <!-- Line labels -->
  <text x="300" y="133" fill="#1e8449" font-size="17" font-weight="700" transform="rotate(22 300 133)">Site-to-Site VPN</text>
  <text x="285" y="440" fill="#7d3c98" font-size="17" font-weight="700" transform="rotate(-35 285 440)">Point-to-Site VPN</text>
  <text x="550" y="640" text-anchor="middle" fill="#ca6f1e" font-size="17" font-weight="700">ExpressRoute: private circuit, bypasses the internet</text>
  <text x="720" y="200" text-anchor="middle" fill="#1e8449" font-size="15" font-weight="700">IPsec tunnel</text>

  <!-- ===== Azure side ===== -->

  <rect x="830" y="140" width="130" height="85" rx="12" fill="#16a085"/>
  <text x="895" y="178" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">VPN</text>
  <text x="895" y="199" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Gateway</text>

  <rect x="830" y="240" width="130" height="75" rx="12" fill="#d35400"/>
  <text x="895" y="272" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">ExpressRoute</text>
  <text x="895" y="293" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Gateway</text>

  <rect x="985" y="140" width="145" height="175" rx="12" fill="#0b2e6b"/>
  <text x="1057" y="222" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Firewall</text>
  <text x="1057" y="244" text-anchor="middle" fill="#ffffff" font-size="14">inspects</text>
  <text x="1057" y="262" text-anchor="middle" fill="#ffffff" font-size="14">hybrid traffic</text>

  <!-- Peering -->
  <line x1="910" y1="330" x2="880" y2="420" stroke="#ffffff" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <line x1="1050" y1="330" x2="1080" y2="420" stroke="#ffffff" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="980" y="385" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">VNet Peering</text>

  <rect x="810" y="420" width="155" height="120" rx="14" fill="#2ecc71"/>
  <text x="887" y="465" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Spoke VNet</text>
  <text x="887" y="492" text-anchor="middle" fill="#ffffff" font-size="16">Web Apps</text>

  <rect x="995" y="420" width="155" height="120" rx="14" fill="#8e44ad"/>
  <text x="1072" y="465" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Spoke VNet</text>
  <text x="1072" y="492" text-anchor="middle" fill="#ffffff" font-size="16">Databases</text>

  <text x="980" y="585" text-anchor="middle" fill="#ffffff" font-size="16" font-style="italic">Hub-and-spoke design</text>
</svg>
