<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 570" width="100%" style="max-width:560px;height:auto;display:block;margin:0 auto;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<text x="30" y="34" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#004a99">Syslog severity levels, most severe first</text>
<rect x="30" y="56" width="440" height="42" rx="4" fill="#ffffff" stroke="#9db4d0" stroke-width="1.3"/>
<rect x="30" y="56" width="46" height="42" rx="4" fill="#cc0000"/>
<text x="53" y="83" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">0</text>
<text x="90" y="74" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#333333">Emergencies</text>
<text x="90" y="91" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">the device is unusable</text>
<text x="456" y="83" text-anchor="end" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1a7a34">sent</text>
<rect x="30" y="106" width="440" height="42" rx="4" fill="#ffffff" stroke="#9db4d0" stroke-width="1.3"/>
<rect x="30" y="106" width="46" height="42" rx="4" fill="#cc0000"/>
<text x="53" y="133" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">1</text>
<text x="90" y="124" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#333333">Alerts</text>
<text x="90" y="141" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">immediate action required</text>
<text x="456" y="133" text-anchor="end" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1a7a34">sent</text>
<rect x="30" y="156" width="440" height="42" rx="4" fill="#ffffff" stroke="#9db4d0" stroke-width="1.3"/>
<rect x="30" y="156" width="46" height="42" rx="4" fill="#cc0000"/>
<text x="53" y="183" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">2</text>
<text x="90" y="174" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#333333">Critical</text>
<text x="90" y="191" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">a critical condition</text>
<text x="456" y="183" text-anchor="end" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1a7a34">sent</text>
<rect x="30" y="206" width="440" height="42" rx="4" fill="#ffffff" stroke="#9db4d0" stroke-width="1.3"/>
<rect x="30" y="206" width="46" height="42" rx="4" fill="#b36b00"/>
<text x="53" y="233" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">3</text>
<text x="90" y="224" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#333333">Errors</text>
<text x="90" y="241" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">an interface line protocol went down</text>
<text x="456" y="233" text-anchor="end" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1a7a34">sent</text>
<rect x="30" y="256" width="440" height="42" rx="4" fill="#ffffff" stroke="#9db4d0" stroke-width="1.3"/>
<rect x="30" y="256" width="46" height="42" rx="4" fill="#b36b00"/>
<text x="53" y="283" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">4</text>
<text x="90" y="274" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#333333">Warnings</text>
<text x="90" y="291" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">a threshold was crossed</text>
<text x="456" y="283" text-anchor="end" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1a7a34">sent</text>
<rect x="30" y="306" width="440" height="42" rx="4" fill="#ffffff" stroke="#9db4d0" stroke-width="1.3"/>
<rect x="30" y="306" width="46" height="42" rx="4" fill="#004a99"/>
<text x="53" y="333" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">5</text>
<text x="90" y="324" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#333333">Notifications</text>
<text x="90" y="341" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">a normal but significant event</text>
<text x="456" y="333" text-anchor="end" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1a7a34">sent</text>
<rect x="30" y="356" width="440" height="42" rx="4" fill="#ffffff" stroke="#9db4d0" stroke-width="1.3"/>
<rect x="30" y="356" width="46" height="42" rx="4" fill="#004a99"/>
<text x="53" y="383" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">6</text>
<text x="90" y="374" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#333333">Informational</text>
<text x="90" y="391" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">an access list matched, a session opened</text>
<text x="456" y="383" text-anchor="end" font-family="Arial" font-size="12.5" font-weight="bold" fill="#1a7a34">sent</text>
<rect x="30" y="406" width="440" height="42" rx="4" fill="#f4f4f4" stroke="#9db4d0" stroke-width="1.3"/>
<rect x="30" y="406" width="46" height="42" rx="4" fill="#b9bfc6"/>
<text x="53" y="433" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff">7</text>
<text x="90" y="424" text-anchor="start" font-family="Arial" font-size="13.5" font-weight="bold" fill="#6b6b6b">Debugging</text>
<text x="90" y="441" text-anchor="start" font-family="Arial" font-size="12" font-weight="normal" fill="#6b6b6b">output from a debug command</text>
<text x="456" y="433" text-anchor="end" font-family="Arial" font-size="12.5" font-weight="bold" fill="#6b6b6b">not sent</text>
<line x1="20" y1="400" x2="540" y2="400" stroke="#cc0000" stroke-width="1.8" stroke-dasharray="7 5"/>
<rect x="150" y="390" width="260" height="20" rx="4" fill="#ffffff"/>
<text x="280" y="405" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#cc0000">logging trap informational</text>
<line x1="30" y1="478" x2="530" y2="478" stroke="#d9e1ea" stroke-width="1.3"/>
<text x="30" y="504" text-anchor="start" font-family="Arial" font-size="13" font-weight="normal" fill="#6b6b6b">A severity keyword sends that level and every level above it in this list.</text>
<text x="30" y="524" text-anchor="start" font-family="Arial" font-size="13" font-weight="normal" fill="#6b6b6b">Informational therefore sends levels 0 through 6 and suppresses debugging,</text>
<text x="30" y="544" text-anchor="start" font-family="Arial" font-size="13" font-weight="normal" fill="#6b6b6b">which on a busy device can generate more messages than the link can carry.</text>
</svg>
